name: Publish Degree Planner v6.3.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v6.3.4.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify v6.3.4 artifact
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'DegreePlanner-6.3.4-Windows-x64.zip'
          $url='https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-6adc-81fb-9b5c-1ca8c84c8c6f/raw?se=2026-08-20T16%3A44%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=2d59b400-9cf8-59ef-b68a-f0e2cf9aa379&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T14%3A49%3A30Z&ske=2026-08-21T14%3A49%3A30Z&sks=b&skv=2026-02-06&sig=O1n0wr2%2BaqFrkCwDhHDFi4QyyAGYJM7vtJP90QUVfDc%3D'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash
          if($zipHash -ne 'A0503F29FC790B45D712A33D60189BDFA7935F53AC99B1CEDF90554AAB97D3FF'){ throw "Artifact ZIP SHA-256 mismatch: $zipHash" }
          $out=Join-Path $env:RUNNER_TEMP 'v634'
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $setup=Join-Path $out 'DegreePlannerSetup_6.3.4_x64.exe'
          $manifest=Join-Path $out 'latest.json'
          if(!(Test-Path $setup) -or !(Test-Path $manifest)){ throw 'Required v6.3.4 files are missing from the artifact.' }
          $setupHash=(Get-FileHash $setup -Algorithm SHA256).Hash
          if($setupHash -ne '5EE906D0CB91E04E14E667543D14B75FEF8E29914432E7E471CD573BC2EB3A5C'){ throw "Setup SHA-256 mismatch: $setupHash" }
          $m=Get-Content $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
          if([string]$m.version -ne '6.3.4'){ throw "Manifest version mismatch: $($m.version)" }
          if([string]$m.sha256 -ne $setupHash){ throw 'Manifest SHA-256 does not match verified installer.' }
          Copy-Item $setup .\DegreePlannerSetup_6.3.4_x64.exe -Force
          Copy-Item $manifest .\latest.json -Force
      - name: Commit public update files
        shell: powershell
        run: |
          git config user.name 'degreeplanner-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DegreePlannerSetup_6.3.4_x64.exe latest.json
          if(git diff --cached --quiet){ Write-Host 'Update files are already current.'; exit 0 }
          git commit -m 'Publish Degree Planner v6.3.4 update'
          git push
